<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify Forms</title></head>
<body>
  <form name="investment-report" data-netlify="true" hidden>
    <input name="fullName">
    <input name="email" type="email">
    <input name="phone">
    <input name="company">
    <input name="analysisSummary">
  </form>

  <form name="consultation-request" data-netlify="true" hidden>
    <input name="fullName">
    <input name="email" type="email">
    <input name="phone">
    <input name="service">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
